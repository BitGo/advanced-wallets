---
name: Release to GHCR

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read  # Needed to resolve private BitGo/build-system action
  contents: write # Needed to create new releases
  packages: write # Needed to push to GHCR
  id-token: write # Needed to create an ephemeral cross-repo token

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: prod
    # Expose semantic-release outputs so downstream jobs can gate on and read the version
    outputs:
      new-release-published: ${{ steps.release.outputs.new_release_published }}
      new-release-version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Release
        id: release
        run: |
          set -euo pipefail
          npx semantic-release 2>&1 | tee /tmp/sr-output.txt
          if grep -q "Published release" /tmp/sr-output.txt; then
            VERSION=$(grep -oP '(?<=Published release )\S+' /tmp/sr-output.txt | head -1)
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report skipped release
        if: steps.release.outputs.new_release_published != 'true'
        run: echo "No releasable commits found — skipping Docker build"

  trivy-scan:
    name: Security - Trivy Scan
    needs: release
    if: ${{ needs.release.outputs.new-release-published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'

  build-and-push:
    name: Build and push image to GHCR
    needs: [release, trivy-scan]
    if: ${{ needs.release.outputs.new-release-published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bitgo/advanced-wallets:${{ needs.release.outputs.new-release-version }}
            ghcr.io/bitgo/advanced-wallets:latest
          build-args: |
            BUILD_VERSION=${{ needs.release.outputs.new-release-version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-demo-kms-api-release:
    name: Trigger demo-kms-api release to GHCR
    needs: [release, trivy-scan]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Get GitHub token
        id: get-github-token
        uses: BitGo/build-system/get-github-token@v6
        with:
          vault-cf-access-client-id: ${{ vars.VAULT_CF_ACCESS_CLIENT_ID }}
          vault-cf-access-client-secret: ${{ secrets.VAULT_CF_ACCESS_CLIENT_SECRET }}
          repositories: '["demo-kms-api"]'

      - name: Trigger and wait for demo-kms-api release to GHCR
        run: |
          set -euo pipefail
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "release-to-ghcr.yaml" --repo "BitGo/demo-kms-api" --ref "main"
          sleep 10
          RUN_ID=$(gh run list --repo "BitGo/demo-kms-api" --workflow "release-to-ghcr.yaml" --limit 5 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$BEFORE\")] | .[0].databaseId")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not find the triggered workflow run in BitGo/demo-kms-api"
            exit 1
          fi
          echo "Watching run $RUN_ID in BitGo/demo-kms-api..."
          gh run watch "$RUN_ID" --repo "BitGo/demo-kms-api" --exit-status
        env:
          GH_TOKEN: ${{ steps.get-github-token.outputs.token }}
