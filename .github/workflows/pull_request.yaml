name: on_pr
run-name: "on_pr: ${{ github.event.pull_request.number }}"

on:
  pull_request:

permissions:
  actions: read # required by BitGo/build-system
  contents: read # required by BitGo/build-system
  id-token: write # required by BitGo/build-system
  pull-requests: write # required by Grype PR commenter
  packages: read # required for ArgoCD deploy

jobs:
  build-and-test:
    name: Build & Test (CI)
    uses: ./.github/workflows/build-and-test.yaml
    secrets:
      fossa-api-key: ${{ secrets.FOSSA_API_KEY }}

  check-openapi-drift:
    name: Check OpenAPI spec drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check OpenAPI spec drift
        run: npm run check:openapi:masterExpress

  check-dependency-changes:
    name: Check for dependency changes
    runs-on: ubuntu-latest
    outputs:
      deps-changed: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for dependency file changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'

  trivy-scan:
    name: Security - Trivy Scan
    needs: check-dependency-changes
    if: needs.check-dependency-changes.outputs.deps-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'

  build-docker-image:
    name: Build the Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/bitgo/advanced-wallets:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/bitgo/advanced-wallets:${GITHUB_SHA}"
          NETWORK="advanced-wallets-smoke-${GITHUB_RUN_ID}"
          AWM_CONTAINER="advanced-wallets-smoke-awm-${GITHUB_RUN_ID}"
          MBE_CONTAINER="advanced-wallets-smoke-mbe-${GITHUB_RUN_ID}"
          FAILED="false"

          cleanup() {
            if [ "${FAILED}" = "true" ]; then
              echo "::group::AWM container logs"
              docker logs "${AWM_CONTAINER}" || true
              echo "::endgroup::"
              echo "::group::Master Express container logs"
              docker logs "${MBE_CONTAINER}" || true
              echo "::endgroup::"
            fi
            docker rm -f "${AWM_CONTAINER}" >/dev/null 2>&1 || true
            docker rm -f "${MBE_CONTAINER}" >/dev/null 2>&1 || true
            docker network rm "${NETWORK}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "${NETWORK}"

          docker run -d --name "${AWM_CONTAINER}" \
            --network "${NETWORK}" \
            --network-alias advanced-wallet-manager \
            -p 127.0.0.1:13080:3080 \
            -e APP_MODE=advanced-wallet-manager \
            -e ADVANCED_WALLET_MANAGER_PORT=3080 \
            -e BIND=0.0.0.0 \
            -e TLS_MODE=disabled \
            -e KEY_PROVIDER_URL=https://key-provider.invalid \
            "${IMAGE}"

          docker run -d --name "${MBE_CONTAINER}" \
            --network "${NETWORK}" \
            -p 127.0.0.1:13081:3081 \
            -e APP_MODE=master-express \
            -e MASTER_EXPRESS_PORT=3081 \
            -e BIND=0.0.0.0 \
            -e TLS_MODE=disabled \
            -e ADVANCED_WALLET_MANAGER_URL=http://advanced-wallet-manager:3080 \
            "${IMAGE}"

          wait_for() {
            local url="${1}"
            local status="none"
            for _ in $(seq 1 30); do
              if status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "${url}")" && [ "${status}" = "200" ]; then
                echo "${url} -> 200"
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for POST ${url} (last status: ${status})"
            FAILED="true"
            return 1
          }

          wait_for "http://127.0.0.1:13080/ping"
          wait_for "http://127.0.0.1:13081/advancedwallet/ping"
          wait_for "http://127.0.0.1:13081/ping/advancedWalletManager"

          echo "Production image smoke checks passed for both application modes."
