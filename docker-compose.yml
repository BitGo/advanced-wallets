# Bootstrap certificates with scripts/bootstrap-compose-certs.sh before starting.
# Supply KEY_PROVIDER_URL (HTTPS) and deploy/certs/awm/key-provider-ca.pem from your key provider.
# Recovery is disabled by default; enable temporarily only with RECOVERY_AUTH_TOKEN set.
services:
  advanced-wallet-manager:
    build: .
    user: "${COMPOSE_UID:?Run scripts/bootstrap-compose-certs.sh}:${COMPOSE_GID:?Run scripts/bootstrap-compose-certs.sh}"
    networks:
      - my-internal-network
    environment:
      - APP_MODE=advanced-wallet-manager
      - ADVANCED_WALLET_MANAGER_PORT=3080
      - BIND=0.0.0.0 # Container-only listener; no host port published
      - TLS_MODE=mtls
      - SERVER_TLS_KEY_PATH=/app/certs/awm-server.key
      - SERVER_TLS_CERT_PATH=/app/certs/awm-server.crt
      - MTLS_ALLOWED_CLIENT_FINGERPRINTS=${AWM_ALLOWED_CLIENT_FINGERPRINTS:?Run scripts/bootstrap-compose-certs.sh and supply --env-file deploy/certs/fingerprints.env}
      - KEY_PROVIDER_URL=${KEY_PROVIDER_URL:?Set an HTTPS key provider URL}
      - KEY_PROVIDER_SERVER_CA_CERT_PATH=/app/certs/key-provider-ca.pem
      - KEY_PROVIDER_CLIENT_TLS_KEY_PATH=/app/certs/awm-key-provider-client.key
      - KEY_PROVIDER_CLIENT_TLS_CERT_PATH=/app/certs/awm-key-provider-client.crt
      - TIMEOUT=305000
      - KEEP_ALIVE_TIMEOUT=65000
      - HEADERS_TIMEOUT=66000
      - HTTP_LOGFILE=logs/http-access.log
      - RECOVERY_MODE=${RECOVERY_MODE:-false}
      - RECOVERY_AUTH_TOKEN=${RECOVERY_AUTH_TOKEN:-}
      - NODE_ENV=production
      - LOG_LEVEL=info
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./deploy/certs/awm:/app/certs:ro

  master-bitgo-express:
    build: .
    user: "${COMPOSE_UID:?Run scripts/bootstrap-compose-certs.sh}:${COMPOSE_GID:?Run scripts/bootstrap-compose-certs.sh}"
    networks:
      - my-internal-network
      - my-public-network # Outbound BitGo API access; no host port published
    environment:
      - APP_MODE=master-express
      - MASTER_EXPRESS_PORT=3081
      - BIND=0.0.0.0 # Container-only listener; no host port published
      - TLS_MODE=mtls
      - SERVER_TLS_KEY_PATH=/app/certs/mbe-server.key
      - SERVER_TLS_CERT_PATH=/app/certs/mbe-server.crt
      - MTLS_ALLOWED_CLIENT_FINGERPRINTS=${MBE_ALLOWED_CLIENT_FINGERPRINTS:?Run scripts/bootstrap-compose-certs.sh and supply --env-file deploy/certs/fingerprints.env}
      - ADVANCED_WALLET_MANAGER_URL=https://advanced-wallet-manager:3080
      - AWM_SERVER_CA_CERT_PATH=/app/certs/ca.crt
      - AWM_CLIENT_TLS_KEY_PATH=/app/certs/mbe-awm-client.key
      - AWM_CLIENT_TLS_CERT_PATH=/app/certs/mbe-awm-client.crt
      - BITGO_ENV=test # Change to prod for production
      - BITGO_DISABLE_ENV_CHECK=false
      - BITGO_AUTH_VERSION=2
      - TIMEOUT=305000
      - KEEP_ALIVE_TIMEOUT=65000
      - HEADERS_TIMEOUT=66000
      - HTTP_LOGFILE=logs/http-access.log
      - RECOVERY_MODE=${RECOVERY_MODE:-false}
      - RECOVERY_AUTH_TOKEN=${RECOVERY_AUTH_TOKEN:-}
      - NODE_ENV=production
      - LOG_LEVEL=info
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./deploy/certs/mbe:/app/certs:ro

networks:
  my-internal-network:
    driver: bridge
    internal: true
  my-public-network:
    driver: bridge
